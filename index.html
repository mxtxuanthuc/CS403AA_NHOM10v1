<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giám sát IoT-AI</title>
    <script>
        // Tự động redirect với xử lý đường dẫn linh hoạt
        (function () {
            const currentPath = window.location.pathname;
            const baseUrl = window.location.origin;

            // Xác định đường dẫn base (cho GitHub Pages hoặc local)
            let redirectPath = '/public/pages/login.html';

            // Nếu đang ở GitHub Pages (có path prefix)
            if (currentPath.includes('/CS403_Nhom10')) {
                const basePath = currentPath.split('/').slice(0, 2).join('/');
                redirectPath = basePath + '/public/pages/login.html';
            }

            // Redirect
            window.location.href = baseUrl + redirectPath;
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .loading-container {
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 2em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 2em;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <div class="loading-container">
        <div class="logo">IoT-AI</div>
        <div class="spinner"></div>
        <div class="loading-text">Đang tải...</div>
    </div>
</body>

</html>
